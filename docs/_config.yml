title: pi-epicflow
description: >-
  Ship multi-feature work as one clean PR. A pi extension that decomposes a
  design.md into a DAG of small features, runs each on its own git worktree,
  and squash-merges them back into a single reviewable PR.

# No remote_theme — using the custom Kinetic Terminal layout under
# _layouts/default.html with tokens in assets/css/kinetic.css.

plugins:
  - jekyll-relative-links
  - jekyll-seo-tag

github:
  is_project_page: true
  repository_url: https://github.com/shankar029/pi-epicflow
  repository_nwo: shankar029/pi-epicflow
  owner_url: https://github.com/shankar029
  owner_name: shankar029

# SEO / social
url: https://shankar029.github.io
baseurl: /pi-epicflow
author: shankar029
twitter:
  card: summary_large_image

# Pretty URLs + render the docs/*.md files we already have
permalink: pretty
relative_links:
  enabled: true
  collections: true
include:
  - design.md
  - RELEASE-CHECKLIST.md
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Kramdown: GFM with attribute lists; nice fenced code blocks.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: false
