# Per-epic configuration. Defaults can be overridden here.
# All durations in seconds, budgets in tokens.

# Test command. If empty, autodetected from repo (dotnet test, npm test, pytest, etc.).
test_cmd: ""

# Build command (run before tests if defined).
build_cmd: ""

# v0.7.2 / L-046 — required toolchain pre-flight.
#
# pi-epic-init runs every validate_cmd before the epic starts. If any fail,
# the operator gets the install_hint as actionable output and pi-epic-init
# refuses to proceed. The goal is to fail at decomposition time, not in the
# middle of F03 with a 'command not found' surprise.
#
# Auto-deferral: if the repo has .tool-versions (asdf) or .mise.toml (mise),
# pi-epic-init prints "run: <toolchain-manager> install" instead of per-SDK
# hints — defer to the toolchain manager the repo already chose.
#
# Auto-install is NOT in v0.7.2 by design (see L-046). The install_hint is
# a string the operator copy/pastes; pi-epicflow does not execute it.
# Rationale: security surface (curl-pipe-bash inside an agent loop is a
# real expansion), portability (apt/brew/winget/pacman per OS), state
# pollution (an epic in /tmp should not permanently mutate global toolchain).
#
# Optional. If unset/empty, the check is skipped.
required_toolchain: []
# Example:
# required_toolchain:
#   - name: dotnet
#     min_version: "9.0"
#     validate_cmd: "dotnet --version"
#     install_hint: "curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --version 9.0"
#   - name: node
#     min_version: "20"
#     validate_cmd: "node --version"
#     install_hint: "nvm install 20 && nvm use 20"

# Halt budgets.
budgets:
  tokens_per_epic: 500000
  wall_clock_per_feature_seconds: 28800   # 8h

# Test retry attempts before halting on H1.
test_retry_attempts: 3

# Reviewer sub-agent retry attempts before halting.
reviewer_retry_attempts: 3

# Worktree location pattern. {repo} = repo basename, {feature} = feature id.
worktree_pattern: "../{repo}-{feature}"

# Whether to push the epic branch to a shared remote during work.
# false = local only until pi-epic-complete opens the PR.
push_epic_branch_during_work: false

# PR options.
pr:
  draft: false
  base: ""                                 # empty → use meta.default_branch
  body_template: ""                        # empty → auto-generated from design.md + features
