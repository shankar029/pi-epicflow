# Feature decomposition for this epic.
# Produced by `pi-epic-decompose`, reviewed and approved by the human ONCE,
# then consumed by `pi-epic-next-feature` in the auto-mode loop.
#
# Contract (L-027): `acceptance_criteria` is NORMATIVE — it's what
# `pi-feature-complete` and the reviewer measure against. `summary` is
# INFORMATIVE — prose context for humans and the planner. When the two
# disagree, the implementation MUST follow `acceptance_criteria`.
# Decomposers: when proposing this file, re-read each feature's summary
# against its AC list before finalizing; if they conflict, rewrite the
# summary as a one-line restatement of the AC + design references.
#
# Rules enforced by `pi-epic-validate-decomposition`:
#   - Every feature has: id, slug, summary, depends_on, scope_files,
#     acceptance_criteria, estimated_hours.
#   - Feature IDs are F01, F02, ... (zero-padded, sequential).
#     Spikes use S01, S02, ... sharing the same numeric counter.
#   - depends_on references valid feature IDs (no cycles, no self-deps).
#   - estimated_hours <= 16 per feature (≤2 days; split if larger).
#     Spikes capped at 8h.
#   - acceptance_criteria are test-shaped for features, decision-shaped
#     for spikes (option B: decision / evidence / impact).
#   - Acceptance-criterion strings starting with `*`, `&`, `!`, `|`, `>`,
#     `%`, `@`, or backtick MUST be quoted (strict-YAML hygiene).
#   - scope_files non-glob entries whose parent dir is missing produce a
#     warning (likely stale paths from an earlier layout).

epic: NNNN-<slug>

# Optional: epic-level reference paths the planner-subagent will read when
# planning any feature flagged `needs_planner: true`. Paths >100KB are
# truncated. Same paths are advertised to feature workers as "prior art
# worth skimming" but not made mandatory.
reference_paths: []
  # - samples/<reference-poc>/
  # - docs/<findings-or-reference>.md

features:

  - id: F01
    slug: <kebab-slug>
    summary: <one sentence>
    kind: feature                          # feature | spike (default: feature)
    depends_on: []                         # list of feature IDs that must be merged first
    estimated_hours: 4
    # Set needs_planner: true if ≥2 of these triggers fire (see prompts/epic-decompose.md):
    #   - AC references an existing subsystem whose call sites are NOT verified
    #   - AC contains literal sample I/O, exit codes, or schema shapes
    #   - scope_files crosses ≥2 module/package boundaries
    #   - depends_on chain depth ≥3
    #   - estimated_hours ≥10
    #   - AC count ≥6
    #   - Description contains: thread/wire/integrate/migrate/default/rollout/deprecate
    needs_planner: false
    planner_triggers: []                   # audit trail of which triggers fired (when needs_planner=true)
    scope_files:                           # globs; pi tries to stay within these but may deviate (logged)
      - path/to/file.cs
      - path/to/dir/**
    acceptance_criteria:                   # each one should imply a test or observable check
      - <criterion 1>
      - <criterion 2>
    # --- Deliverable fields (v0.10+) ---
    # Optional. All default to empty/absent for backward compatibility.
    # These become first-class scope: workers must produce them, reviewers audit them,
    # and pi-feature-complete refuses merge if declared deliverables are missing.
    e2e_scenarios: []                      # Paths to E2E test files this feature must produce.
                                           # Populate when AC contains user-facing verbs (click, see,
                                           # navigate, submit, GET/POST endpoints).
    mock_fixtures: []                      # Paths to mock/fixture files for external SDK dependencies.
                                           # Populate when scope_files imports a known external SDK
                                           # (stripe, openai, twilio, aws-sdk, etc.).
    docs_updates: []                       # Paths to documentation files this feature must update.
                                           # Populate when the feature ships public API changes or
                                           # user-observable contract changes.
    changelog_entry: false                 # Whether this feature requires a CHANGELOG.md entry.
                                           # Set true when the feature ships user-observable behavior.
    references:                            # links to design.md sections, external docs, etc.
      - design.md#section
    notes: |
      Optional freeform context for pi at implementation time.

  - id: F02
    slug: <kebab-slug>
    summary: <one sentence>
    depends_on: [F01]
    estimated_hours: 6
    scope_files:
      - path/to/other.cs
    acceptance_criteria:
      - <criterion>

  # Example spike (uncomment if your epic has decision-shaped work that
  # blocks downstream features). Spikes ship a decision artifact, not
  # production code. AC is decision-shaped: decision + evidence + impact.
  #
  # - id: S01
  #   kind: spike
  #   slug: <kebab-slug>
  #   summary: Decide <X> seam / approach before <F0N..F0M> can start
  #   depends_on: []
  #   estimated_hours: 4
  #   scope_files: []                     # spikes typically have none
  #   acceptance_criteria:
  #     - Decision logged in deviations.md with chosen option
  #     - Evidence cited (call sites, code refs, benchmark, prototype)
  #     - Impact on blocked features documented
  #   blocks: [F0N, F0M]                  # informational; advise downstream planning
