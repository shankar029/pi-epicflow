# Epic-level structured fields. Updated by pi as work proceeds.
id: NNNN-<slug>
title: <Epic title>
status: design                    # design | decomposed | in-progress | review | blocked | done | abandoned
branch: epic/<slug>
default_branch: main              # the branch to PR INTO at the end
owner: <handle>
started: YYYY-MM-DD
updated: YYYY-MM-DD
links:
  pr:
  issue:
  design_doc: design.md
tags: []
extensions: []                    # v0.6.3 — pi-epic-extend appends entries here

# v0.10 — Deliverables summary (optional).
# Populated by pi-epic-init when decomposition.yaml declares deliverable fields
# (e2e_scenarios, mock_fixtures, docs_updates, changelog_entry). Provides a
# quick at-a-glance count of declared deliverables across the epic.
# If decomposition.yaml has no deliverable fields, this section is omitted.
